<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VN Studio</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a22; --panel2:#1b1f29; --ink:#d8dde7; --mut:#868ea0;
    --acc:#f0a92e; --acc2:#5fd0e0; --edge:#282d3a; --sel:#2e3648; --selink:#ffffff;
    --ui: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    --outw: 240px; --insw: 300px; --tlh: 214px;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}   /* una regla de id le gana al [hidden] del browser */
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:12.5px/1.45 var(--ui);
       overflow:hidden;user-select:none}
  button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--edge);
         border-radius:4px;padding:3px 8px;cursor:pointer;white-space:nowrap}
  button:hover{background:var(--sel);border-color:var(--mut)}
  button:active{background:#39415a}
  button:disabled{opacity:.35;cursor:default;background:var(--panel2);border-color:var(--edge)}
  button.on{background:var(--sel);border-color:var(--acc);color:#fff}
  .ico{width:26px;height:24px;padding:0;display:inline-grid;place-items:center;font-size:13px}
  input,select,textarea{font:inherit;color:var(--ink);background:#0c0e14;
        border:1px solid var(--edge);border-radius:4px;padding:3px 6px;width:100%}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--acc2);border-color:var(--acc2)}
  .sep{width:1px;height:18px;background:var(--edge);margin:0 4px}

  /* ---------- shell ---------- */
  #app{height:100%;display:grid;
       grid-template-rows:38px minmax(0,1fr) 5px var(--tlh) 22px}
  #topbar{display:flex;align-items:center;gap:5px;padding:0 8px;background:var(--panel);
          border-bottom:1px solid var(--edge)}
  .brand{font:700 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;
         color:var(--mut);margin-right:6px}
  .brand b{color:var(--acc)}
  .grow{flex:1}
  #body{display:grid;grid-template-columns:var(--outw) 5px minmax(0,1fr) 5px var(--insw);
        min-height:0}
  .pane{background:var(--panel);border:1px solid var(--edge);border-top:0;border-bottom:0;
        display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .phead{height:24px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 8px;
         font:600 10px/1 var(--ui);letter-spacing:.11em;text-transform:uppercase;color:var(--mut);
         background:var(--panel2);border-bottom:1px solid var(--edge)}
  .phead .grow{flex:1}
  .pbody{flex:1 1 auto;overflow:auto;min-height:0}
  .vsplit{cursor:col-resize;background:var(--bg)}
  .hsplit{cursor:row-resize;background:var(--bg)}
  .vsplit:hover,.hsplit:hover,.vsplit.drag,.hsplit.drag{background:var(--acc2)}

  /* ---------- modo Play: se apaga todo menos el juego y el timeline ---------- */
  body.playing #outliner, body.playing #inspector,
  body.playing #topbar > :not(#b-play):not(.grow){opacity:.28;pointer-events:none;
       filter:saturate(.4);transition:opacity .15s}
  body.playing #timeline{box-shadow:inset 0 2px 0 var(--acc)}
  body.playing #timeline .bar{opacity:.28;pointer-events:none}   /* no se edita en Play */
  .clip.playing{outline:2px solid var(--acc);outline-offset:-1px;filter:brightness(1.4)}
  body.playing .playhead{width:2px;box-shadow:0 0 8px var(--acc)}

  /* ---------- outliner ---------- */
  ul.list{list-style:none;margin:0;padding:2px 0}
  ul.list li{display:flex;align-items:center;gap:6px;padding:3px 8px;cursor:pointer;
             font:12px/1.4 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  ul.list li:hover{background:#222736}
  ul.list li.sel{background:var(--sel);color:var(--selink);box-shadow:inset 2px 0 0 var(--acc)}
  ul.list li .n{color:var(--mut);font-size:11px}
  .bar{display:flex;gap:4px;padding:5px 6px;border-top:1px solid var(--edge);background:var(--panel2)}

  /* ---------- viewport ---------- */
  #viewport{position:relative;display:grid;place-items:center;background:
            repeating-conic-gradient(#0b0d12 0% 25%, #0e1116 0% 50%) 50%/16px 16px;
            overflow:hidden}
  #stagewrap{position:relative;overflow:hidden;background:#05060f;
             box-shadow:0 0 0 1px var(--edge), 0 10px 40px #0009}
  #stage{position:absolute;inset:0}
  .layer{position:absolute;cursor:grab;touch-action:none}
  .layer:active{cursor:grabbing}
  .layer.sel{outline:1px solid var(--acc2);outline-offset:2px}
  .chip{width:9px;height:9px;border-radius:2px;flex:0 0 auto;box-shadow:inset 0 0 0 1px #0006}
  .layer img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
  .ph{width:100%;height:100%;border-radius:14% 14% 4% 4%;
      box-shadow:inset 0 0 0 1px #fff3, 0 6px 20px #0007;
      display:flex;align-items:flex-end;justify-content:center;color:#0008;
      font:700 clamp(10px,3vw,28px) var(--ui)}
  #anim{position:absolute;inset:0;z-index:999;width:100%;height:100%;object-fit:fill;
        background:#05060f;cursor:pointer}
  #guides{position:absolute;inset:0;pointer-events:none;z-index:800}
  #guides .g{position:absolute;background:#ffffff26}
  #guides .safe{position:absolute;border:1px dashed #ffffff40}
  #frame{position:absolute;outline:1px solid var(--acc2);pointer-events:none;z-index:990}
  #frame .hnd{position:absolute;width:8px;height:8px;background:var(--acc2);
              border-radius:2px;pointer-events:auto;cursor:nwse-resize}
  #flabel{position:absolute;left:0;top:-17px;color:#04121a;background:var(--acc2);
          font:10px/1 var(--mono);padding:2px 4px;border-radius:2px;white-space:nowrap}
  #gv{position:absolute;top:0;bottom:0;border-left:1px dashed var(--acc2);pointer-events:none}
  #gh{position:absolute;left:0;right:0;border-top:1px dashed var(--acc);pointer-events:none}
  #dbox{position:absolute;z-index:900;left:3%;right:3%;bottom:4%;min-height:22%;
        background:linear-gradient(180deg,#141b3aee,#0a0e22f2);
        border:1px solid var(--edge);border-top:2px solid var(--acc);
        border-radius:3px 3px 8px 8px;padding:12px 14px}
  #who{font-weight:700;color:var(--acc);margin-bottom:3px}
  #text{white-space:pre-wrap;user-select:text}
  #choices.edit{pointer-events:none}
  #choices.edit button{opacity:.85;border-style:dashed}
  #choices .tag{position:absolute;top:8px;left:0;right:0;text-align:center;
                color:var(--acc);font:11px var(--mono)}
  #animbar{position:absolute;z-index:1000;top:8px;left:50%;transform:translateX(-50%);
           display:flex;gap:8px;align-items:center;background:#171a22e6;color:var(--ink);
           border:1px solid var(--edge);border-radius:6px;padding:5px 8px;font:11px var(--mono)}
  #choices{position:absolute;inset:0;z-index:950;display:flex;flex-direction:column;gap:8px;
           align-items:center;justify-content:center;background:#0009}
  #choices button{min-width:46%;padding:7px 12px}
  #vpbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:5px;align-items:center;
         pointer-events:none}
  #vpbar button{pointer-events:auto;background:#171a22cc;backdrop-filter:blur(4px)}
  #vptag{pointer-events:none;color:var(--mut);font:11px var(--mono);
         background:#171a22cc;padding:2px 7px;border-radius:4px}

  /* ---------- inspector ---------- */
  #props details{border-bottom:1px solid var(--edge)}
  #props summary{cursor:pointer;padding:5px 8px;font:600 10px/1.7 var(--ui);
       letter-spacing:.11em;text-transform:uppercase;color:var(--mut);
       display:flex;align-items:center;gap:6px;list-style:none}
  #props summary::-webkit-details-marker{display:none}
  #props summary::before{content:"▸";font-size:9px}
  #props details[open] summary::before{content:"▾"}
  #props summary:hover{color:var(--ink);background:#222736}
  #props details > *:not(summary){margin:0 8px}
  #props details > *:last-child{margin-bottom:8px}
  #props label.scrub{cursor:ew-resize;color:var(--acc2);
       text-decoration:underline dotted var(--edge)}
  #props .hint{margin:6px 8px 2px}
  #props textarea{resize:vertical}
  .row{display:flex;gap:6px;align-items:center;margin:3px 0}
  .row label{color:var(--mut);min-width:64px;font-size:11.5px}
  .hint{color:var(--mut);font-size:11px;margin:6px 0 2px;line-height:1.4}
  #probs{color:#ff9d9d;font:11px var(--mono);white-space:pre-wrap;padding:0 8px}
  #probs:not(:empty){padding:6px 8px;background:#2a1520;border-bottom:1px solid #4a2030}

  /* ---------- timeline ---------- */
  #timeline{background:var(--panel);border-top:1px solid var(--edge);
            display:flex;flex-direction:column;min-height:0}
  #tlbody{flex:1 1 auto;display:grid;grid-template-columns:78px minmax(0,1fr);min-height:0}
  .tl-labels{border-right:1px solid var(--edge);background:var(--panel2);padding-top:18px}
  .tl-labels div{height:22px;display:flex;align-items:center;padding:0 8px;color:var(--mut);
                 font:10px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase}
  .tl-track{position:relative;overflow:auto}
  .lane{position:absolute;left:0;right:0}
  .lane.odd{background:#ffffff0d}
  .tl-inner{position:relative;min-width:100%}
  .tl-ruler{position:absolute;top:0;left:0;height:18px;border-bottom:1px solid var(--edge)}
  .tl-tick{position:absolute;top:0;height:18px;border-left:1px solid var(--edge);
           padding-left:4px;color:var(--mut);font:10px/18px var(--mono)}
  .clip{position:absolute;border-radius:3px;padding:0 6px;overflow:hidden;cursor:grab;
        font:11.5px/1 var(--mono);display:flex;align-items:center;white-space:nowrap;
        color:#e9eefb;box-shadow:inset 0 1px 0 #ffffff22;touch-action:none}
  .clip:hover{filter:brightness(1.25)}
  .clip.sel{outline:1.5px solid var(--acc);outline-offset:-1px;color:#fff;filter:brightness(1.3)}
  .clip.drag{opacity:.75;cursor:grabbing;z-index:5}
  .playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--acc);pointer-events:none}
  .playhead::before{content:"";position:absolute;top:0;left:-5px;border:5px solid transparent;
                    border-top-color:var(--acc);border-bottom:0}

  /* ---------- status ---------- */
  #status{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--panel2);
          border-top:1px solid var(--edge);color:var(--mut);font:11px var(--mono);
          white-space:nowrap;overflow:hidden}
  #status .grow{flex:1}
  #toast{position:fixed;right:14px;bottom:34px;z-index:9999;max-width:44ch;
         background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--acc2);
         border-radius:5px;padding:8px 12px;box-shadow:0 8px 30px #000a;font-size:12px}
  #toast.bad{border-left-color:#e2586a;color:#ffd7dc}

  /* ---------- diálogos ---------- */
  dialog{border:1px solid var(--edge);border-radius:8px;background:var(--panel);
         color:var(--ink);padding:0;min-width:320px;box-shadow:0 20px 60px #000a}
  dialog::backdrop{background:#000a}
  dialog h3{margin:0;padding:10px 14px;font:600 11px/1 var(--ui);letter-spacing:.1em;
            text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--edge)}
  dialog #dlg-body,dialog table{padding:12px 14px}
  dialog menu{display:flex;justify-content:flex-end;gap:6px;margin:0;padding:10px 14px;
              border-top:1px solid var(--edge)}
  dialog button.primary{background:var(--acc);color:#1a1204;border-color:var(--acc);font-weight:600}
  dialog table{border-collapse:collapse;font-size:12px}
  dialog td{padding:3px 10px 3px 0;vertical-align:top}
  dialog td.k{color:var(--acc2);font:12px var(--mono);white-space:nowrap}
  #dlg-msg{color:var(--mut);margin-bottom:6px}
  #brw{min-width:min(560px,92vw)}
  #brw-crumbs{display:flex;flex-wrap:wrap;gap:2px;padding:8px 14px 0;font:11px var(--mono)}
  #brw-crumbs button{padding:1px 5px;background:transparent;border-color:transparent;color:var(--acc2)}
  #brw-crumbs button:hover{background:var(--sel);border-color:var(--edge)}
  #brw-list{list-style:none;margin:8px 14px 0;padding:0;height:46vh;overflow:auto;
            border:1px solid var(--edge);border-radius:5px;background:#0c0e14}
  #brw-list li{padding:4px 8px;cursor:pointer;font:12px/1.5 var(--mono);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #brw-list li:hover{background:#222736}
  #brw-list li.sel{background:var(--sel);color:#fff}
  #brw-list li.dir{color:var(--acc)}
  #brw-foot{display:flex;gap:5px;padding:8px 14px 0}
  #brw-foot input{font:12px var(--mono)}
</style></head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">VN<b>Studio</b></div>
    <button id="b-new" class="ico" title="Nuevo proyecto">✧</button>
    <button id="b-open" class="ico" title="Abrir .vn">📂</button>
    <button id="b-save" class="ico" title="Guardar (Ctrl+S)">💾</button>
    <button id="b-export" title="Exportar player HTML">Exportar</button>
    <div class="sep"></div>
    <button id="b-undo" class="ico" title="Deshacer (Ctrl+Z)">↶</button>
    <button id="b-redo" class="ico" title="Rehacer (Ctrl+Y)">↷</button>
    <div class="sep"></div>
    <button id="b-char" title="Nuevo personaje">＋ Personaje</button>
    <button id="b-validate" title="Validar el proyecto">Validar</button>
    <div class="grow"></div>
    <button id="b-help" class="ico" title="Atajos (?)">?</button>
    <button id="b-probar" title="Previsualizar la transición del paso">▶ Probar paso</button>
    <button id="b-play" title="Reproducir la escena (Space)">▶ Play</button>
  </header>

  <div id="body">
    <aside class="pane" id="outliner">
      <div class="phead">Escenas<span class="grow"></span><span id="m-count"></span></div>
      <div class="pbody" style="flex:0 1 auto;max-height:32%"><ul class="list" id="scenes"></ul></div>
      <div class="bar">
        <button id="b-scene-add" class="ico" title="Nueva escena">＋</button>
        <button id="b-scene-dup" class="ico" title="Duplicar">⧉</button>
        <button id="b-scene-ren" class="ico" title="Renombrar">✎</button>
        <span class="grow"></span>
        <button id="b-scene-up" class="ico" title="Subir">↑</button>
        <button id="b-scene-dn" class="ico" title="Bajar">↓</button>
      </div>
      <div class="phead">Capas<span class="grow"></span><span id="m-layers"></span></div>
      <div class="pbody"><ul class="list" id="layers"></ul></div>
    </aside>

    <div class="vsplit" data-pane="out"></div>

    <main id="viewport">
      <div id="stagewrap">
        <div id="stage"></div>
        <div id="dbox" hidden><div id="who"></div><div id="text"></div></div>
        <div id="choices" hidden></div>
        <div id="guides"></div>
        <div id="frame" hidden>
          <span class="hnd" data-h="-1" style="left:-4px;top:-4px"></span>
          <span class="hnd" data-h="1"  style="right:-4px;top:-4px"></span>
          <span class="hnd" data-h="-1" style="left:-4px;bottom:-4px"></span>
          <span class="hnd" data-h="1"  style="right:-4px;bottom:-4px"></span>
          <span id="flabel"></span>
        </div>
        <div id="gv" hidden></div><div id="gh" hidden></div>
        <img id="anim" hidden alt="">
        <div id="animbar" hidden><span>reproduciendo la transición…</span>
          <button id="b-anim-x">✕ salir</button></div>
      </div>
      <div id="vpbar">
        <button id="b-guides" title="Guías: centro / tercios / zona segura (G)">⊞ guías</button>
        <button id="b-overlay" title="Mostrar/ocultar el cuadro de diálogo y las opciones">👁 diálogo</button>
        <span class="grow"></span>
        <span id="vptag"></span>
        <button id="b-adv" hidden title="Avanzar (click en el escenario o Espacio)">⏭ avanzar</button>
        <button id="b-exit" hidden title="Salir (Esc)">⏹ salir</button>
      </div>
    </main>

    <div class="vsplit" data-pane="ins"></div>

    <aside class="pane" id="inspector">
      <div class="phead">Propiedades<span class="grow"></span><span id="m-op"></span></div>
      <div id="probs"></div>
      <div class="pbody"><div id="props"></div></div>
    </aside>
  </div>

  <div class="hsplit" data-pane="tl"></div>

  <section id="timeline">
    <div class="phead">Timeline<span class="grow"></span><span id="m-scene"></span></div>
    <div id="tlbody"></div>
    <div class="bar">
      <select id="newop" style="width:auto"></select>
      <button id="b-step-add" class="ico" title="Agregar paso">＋</button>
      <button id="b-step-dup" class="ico" title="Duplicar paso">⧉</button>
      <button id="b-step-del" class="ico" title="Borrar paso (Del)">🗑</button>
      <div class="sep"></div>
      <button id="b-step-up" class="ico" title="Mover antes">◀</button>
      <button id="b-step-dn" class="ico" title="Mover después">▶</button>
      <span class="grow"></span>
      <button id="b-prev" class="ico" title="Paso anterior (←)">⏮</button>
      <button id="b-next" class="ico" title="Paso siguiente (→)">⏭</button>
    </div>
  </section>

  <footer id="status">
    <span id="m-path"></span><span class="grow"></span>
    <span id="m-bgm"></span><span id="m-sel"></span><span id="m-zoom"></span>
  </footer>
</div>

<div id="toast" hidden></div>

<dialog id="dlg"><form method="dialog">
  <h3 id="dlg-title"></h3>
  <div id="dlg-body"></div>
  <menu><button type="button" id="dlg-cancel" onclick="this.closest('dialog').close('')">Cancelar</button>
        <button value="ok" id="dlg-ok" class="primary">Aceptar</button></menu>
</form></dialog>

<dialog id="brw"><form method="dialog">
  <h3 id="brw-title">Elegir archivo</h3>
  <div id="brw-crumbs"></div>
  <ul id="brw-list"></ul>
  <div id="brw-foot">
    <input id="brw-path" spellcheck="false">
    <button type="button" id="brw-up" title="Carpeta de arriba">↑</button>
    <button type="button" id="brw-home" title="Ir a tu carpeta">⌂</button>
    <button type="button" id="brw-upload" title="Subir un archivo desde el diálogo del sistema">⇧ subir</button>
  </div>
  <menu><button type="button" onclick="this.closest('dialog').close('')">Cancelar</button>
        <button value="ok" class="primary">Elegir</button></menu>
</form></dialog>

<dialog id="help"><form method="dialog">
  <h3>Atajos</h3>
  <table id="help-body"></table>
  <menu><button value="" class="primary">Cerrar</button></menu>
</form></dialog>

<script src="/static/logic.js"></script>
<script src="/static/app.js"></script>
</body></html>
